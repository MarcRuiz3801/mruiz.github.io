<script>
    window.game = { aura: 0, totalClicks: 0, perClick: 1, perSec: 0, upgradesBought: 0, mogger2Unlocked: false, currentMogger: 'marldri.png' };

    const upgrades = [
        { id: 'jawline', name: 'Ejercitador de Jawline 💎', desc: '+1 Aura por cada clic', cost: 15, costMult: 1.45, owned: 0, type: 'click', power: 1 },
        { id: 'mewing', name: 'Técnica de Mewing 🤫', desc: '+2 Aura por segundo', cost: 50, costMult: 1.4, owned: 0, type: 'sec', power: 2 },
        { id: 'cold_shower', name: 'Ducha Fría de Madrugada 🧊', desc: '+5 Aura por cada clic', cost: 200, costMult: 1.42, owned: 0, type: 'click', power: 5 },
        { id: 'gym_rat', name: 'Gimnasio Mogger 🏋️‍♂️', desc: '+12 Aura por segundo', cost: 800, costMult: 1.38, owned: 0, type: 'sec', power: 12 },
        { id: 'canthal_tilt', name: 'Masaje de Canthal Tilt 👀', desc: '+25 Aura por cada clic', cost: 3000, costMult: 1.35, owned: 0, type: 'click', power: 25 },
        { id: 'lookmaxxing', name: 'Racha de Lookmaxxing ✨', desc: '+75 Aura por segundo', cost: 10000, costMult: 1.32, owned: 0, type: 'sec', power: 75 }
    ];

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(620, audioCtx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
    }

    function playBuySound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    }

    function startGame() {
        initAudio();
        const startScreen = document.getElementById('start-screen');
        startScreen.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => { startScreen.style.display = 'none'; }, 500);
        showToast('¡Bienvenido! Usa clic o ESPACIO para pulsar a tu Mogger.');
    }

    function handleTouch(e) {
        e.preventDefault();
        clickMogger(e.touches[0]);
    }

    function getTotalClickPower() {
        const moggerBonus = game.currentMogger === 'mogger2.png' ? 5 : 0;
        return game.perClick + moggerBonus;
    }

    function clickMogger(e) {
        const clickPower = getTotalClickPower();
        game.aura += clickPower;
        game.totalClicks += 1;
        playClickSound();

        const img = document.getElementById('mogger-img');
        img.classList.remove('mogger-pressed');
        void img.offsetWidth;
        img.classList.add('mogger-pressed');
        setTimeout(() => img.classList.remove('mogger-pressed'), 80);

        createClickText(e, `+${clickPower}`);
        updateUI();
        saveProgress();
    }

    function createClickText(e, text) {
        const container = document.getElementById('floating-container');
        const el = document.createElement('div');
        el.className = 'click-text text-pink-400 font-black text-2xl sm:text-3xl drop-shadow-lg select-none';
        el.innerText = text;

        const rect = container.getBoundingClientRect();
        let x = rect.width / 2;
        let y = rect.height / 2;

        if (e && e.clientX && e.clientY) {
            x = e.clientX - rect.left - 15;
            y = e.clientY - rect.top - 20;
        } else {
            x += (Math.random() * 80 - 40);
            y += (Math.random() * 40 - 20);
        }

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        container.appendChild(el);
        setTimeout(() => el.remove(), 750);
    }

    // NUEVO: permitir clic con la tecla ESPACIO
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault(); // evita scroll con espacio
            clickMogger(e);
        }
    });

    function unlockMogger2() {
        if (!game.mogger2Unlocked) {
            if (game.aura >= 750) {
                game.aura -= 750;
                game.mogger2Unlocked = true;
                game.currentMogger = 'mogger2.png';
                playBuySound();
                showToast('¡Has desbloqueado a Marcus! 🔥 (+5 extra por clic)');
            } else {
                showToast('Necesitas 750 de Aura para desbloquear a Marcus.');
            }
        }
        updateUI();
        saveProgress();
    }

    function switchMogger(filename) {
        if (filename === 'mogger2.png' && !game.mogger2Unlocked) return;
        game.currentMogger = filename;
        updateUI();
        saveProgress();
        const nameLabel = filename === 'mogger2.png' ? 'Marcus (+5 extra/clic)' : 'Marldri';
        showToast(`Mogger seleccionado: ${nameLabel}`);
    }

    function buyUpgrade(index) {
        const upg = upgrades[index];
        if (game.aura >= upg.cost) {
            game.aura -= upg.cost;
            upg.owned += 1;
            game.upgradesBought += 1;
            if (upg.type === 'click') game.perClick += upg.power;
            else if (upg.type === 'sec') game.perSec += upg.power;
            upg.cost = Math.round(upg.cost * upg.costMult);
            playBuySound();
            showToast(`¡Comprado: ${upg.name}!`);
            updateUI();
            saveProgress();
        } else {
            showToast('Te falta Aura para esta mejora.');
        }
    }

    function initUpgradesDOM() {
        const list = document.getElementById('upgrades-list');
        list.innerHTML = '';
        upgrades.forEach((upg, idx) => {
            const item = document.createElement('div');
            item.id = `upgrade-item-${idx}`;
            item.className = `flex items-center justify-between p-3.5 rounded-xl border transition-all duration-200 cursor-pointer`;
            item.onclick = () => buyUpgrade(idx);
            item.innerHTML = `
                <div class="pr-2 pointer-events-none">
                    <div class="font-bold text-slate-100 text-sm flex items-center gap-1.5">
                        ${upg.name}
                        <span id="upg-owned-${idx}" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-pink-400">x${upg.owned}</span>
                    </div>
                    <div class="text-xs text-slate-400 mt-0.5">${upg.desc}</div>
                </div>
                <button id="upg-btn-${idx}" class="px-3.5 py-1.5 rounded-xl text-xs font-black shrink-0 font-['Space_Grotesk'] transition-all pointer-events-none">
                    ${upg.cost.toLocaleString()} ✨
                </button>
            `;
            list.appendChild(item);
        });
    }

    function initMoggerSelectorDOM() {
        const container = document.getElementById('mogger-unlock-container');
        container.innerHTML = `
            <div id="mogger-box" class="p-3 bg-slate-950/50 rounded-xl border border-slate-800 space-y-2">
                <div id="mogger-lock-view">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs text-slate-300 font-bold">Marcus</span>
                        <span id="mogger-cost-text" class="text-xs font-black text-pink-400 font-['Space_Grotesk']">750 Aura</span>
                    </div>
                    <button id="mogger-action-btn" onclick="unlockMogger2()" class="w-full py-2 px-3 rounded-lg text-xs font-black transition-all">🔓 DESBLOQUEAR MARCUS</button>
                </div>
                <div id="mogger-select-view" class="hidden space-y-2">
                    <span class="text-xs text-slate-400 font-bold block">Selecciona tu Mogger:</span>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-mogger-1" onclick="switchMogger('marldri.png')" class="py-2 px-2 rounded-lg text-xs font-black border transition-all">Marldri</button>
                        <button id="btn-mogger-2" onclick="switchMogger('mogger2.png')" class="py-2 px-2 rounded-lg text-xs font-black border transition-all">Marcus 🔥</button>
                    </div>
                </div>
            </div>
        `;
    }

    function updateUI() {
        document.getElementById('aura-count').innerText = Math.floor(game.aura).toLocaleString();

        const totalClickPower = getTotalClickPower();
        document.getElementById('aura-per-click').innerText = `+${totalClickPower.toLocaleString()}`;

        document.getElementById('aura-per-sec').innerText = game.perSec.toLocaleString();
        document.getElementById('total-clicks').innerText = game.totalClicks.toLocaleString();
        document.getElementById('upgrades-bought').innerText = game.upgradesBought.toLocaleString();

        const imgEl = document.getElementById('mogger-img');
        if (imgEl && (!imgEl.src.endsWith(game.currentMogger) && !imgEl.dataset.failed)) {
            imgEl.src = game.currentMogger;
        }

        let rank = "Novato 🤫";
        if (game.totalClicks >= 500 || game.aura >= 50000) rank = "Mogger Supremo 🗿";
        else if (game.totalClicks >= 250 || game.aura >= 10000) rank = "Rey del Mewing 👑";
        else if (game.totalClicks >= 100 || game.aura >= 2000) rank = "Máscara de Hierro ⚔️";
        else if (game.totalClicks >= 30 || game.aura >= 300) rank = "Estudiante del Mewing 📘";

        document.getElementById('mogger-rank').innerText = rank;

        upgrades.forEach((upg, idx) => {
            const canAfford = game.aura >= upg.cost;
            const item = document.getElementById(`upgrade-item-${idx}`);
            const btn = document.getElementById(`upg-btn-${idx}`);
            const owned = document.getElementById(`upg-owned-${idx}`);
            if (item && btn && owned) {
                owned.innerText = `x${upg.owned}`;
                btn.innerText = `${upg.cost.toLocaleString()} ✨`;
                if (canAfford) {
                    item.className = "flex items-center justify-between p-3.5 rounded-xl border transition-all duration-200 bg-slate-950/70 border-slate-700/80 hover:border-pink-500/60 cursor-pointer shadow-md";
                    btn.className = "px-3.5 py-1.5 rounded-xl text-xs font-black shrink-0 font-['Space_Grotesk'] transition-all bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow-lg shadow-pink-500/20 hover:scale-105 pointer-events-none";
                } else {
                    item.className = "flex items-center justify-between p-3.5 rounded-xl border transition-all duration-200 bg-slate-950/30 border-slate-800/40 opacity-50 cursor-not-allowed";
                    btn.className = "px-3.5 py-1.5 rounded-xl text-xs font-black shrink-0 font-['Space_Grotesk'] transition-all bg-slate-800 text-slate-500 pointer-events-none";
                }
            }
        });

        const lockView = document.getElementById('mogger-lock-view');
        const selectView = document.getElementById('mogger-select-view');
        const actionBtn = document.getElementById('mogger-action-btn');
        if (lockView && selectView && actionBtn) {
            if (!game.mogger2Unlocked) {
                lockView.classList.remove('hidden');
                selectView.classList.add('hidden');
                const canAfford = game.aura >= 750;
                actionBtn.className = canAfford
                    ? "w-full py-2 px-3 rounded-lg text-xs font-black transition-all bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:scale-105 shadow-lg shadow-purple-500/20 cursor-pointer"
                    : "w-full py-2 px-3 rounded-lg text-xs font-black transition-all bg-slate-800 text-slate-500 cursor-not-allowed";
            } else {
                lockView.classList.add('hidden');
                selectView.classList.remove('hidden');
                const btn1 = document.getElementById('btn-mogger-1');
                const btn2 = document.getElementById('btn-mogger-2');
                if (btn1 && btn2) {
                    btn1.className = `py-2 px-2 rounded-lg text-xs font-black border transition-all ${game.currentMogger === 'marldri.png' ? 'bg-pink-600 border-pink-400 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'}`;
                    btn2.className = `py-2 px-2 rounded-lg text-xs font-black border transition-all ${game.currentMogger === 'mogger2.png' ? 'bg-purple-600 border-purple-400 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'}`;
                }
            }
        }
    }

    let toastTimeout;
    function showToast(text) {
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toast-text');
        toastText.innerText = text;
        toast.classList.remove('translate-y-24', 'opacity-0');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.add('translate-y-24', 'opacity-0');
        }, 2400);
    }

    function saveProgress() {
        localStorage.setItem('click_the_mogger_save', JSON.stringify({
            game: game,
            upgrades: upgrades.map(u => ({ id: u.id, owned: u.owned, cost: u.cost }))
        }));
    }

    function loadProgress() {
        const saved = localStorage.getItem('click_the_mogger_save');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.game) game = { ...game, ...data.game };
                if (data.upgrades) {
                    data.upgrades.forEach(savedUpg => {
                        const found = upgrades.find(u => u.id === savedUpg.id);
                        if (found) {
                            found.owned = savedUpg.owned;
                            found.cost = savedUpg.cost;
                        }
                    });
                }
            } catch (e) {
                console.error("Error al cargar datos guardados", e);
            }
        }
    }

    function resetGame() {
        if (confirm("¿Seguro que quieres reiniciar todo tu progreso de Aura?")) {
            localStorage.removeItem('click_the_mogger_save');
            location.reload();
        }
    }

    setInterval(() => {
        if (game.perSec > 0) {
            game.aura += game.perSec / 10;
            updateUI();
        }
    }, 100);

    setInterval(saveProgress, 10000);

    window.addEventListener('DOMContentLoaded', () => {
        loadProgress();
        initUpgradesDOM();
        initMoggerSelectorDOM();
        updateUI();
    });
</script>
